services:
  postgres:
    image: postgres:16-alpine
    container_name: campusfix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusfix
      POSTGRES_PASSWORD: campusfix_secret
      POSTGRES_DB: campusfix
    ports:
      - "5432:5432"
    volumes:
      - campusfix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfix -d campusfix"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusfix_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://campusfix:campusfix_secret@postgres:5432/campusfix?schema=public"
      JWT_SECRET: "campusfix-super-secret-jwt-token-key-min-32-chars-long"
      APP_VERSION: "1.0.0"
      EMERGENCY_PHONE: "+62 21 555-0911 / Extension 911"
      NEXT_PUBLIC_EMERGENCY_PHONE: "+62 21 555-0911 / Extension 911"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  campusfix_pgdata:
